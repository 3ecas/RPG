# One-click hosting of the game server on Render (https://render.com): New -> Blueprint -> this repository.
# Render sets PORT itself; the free plan sleeps after inactivity and wakes on the first connection.
# Render asks for DATABASE_URL when the blueprint is created: paste a Postgres connection string
# (Neon's free tier works; the README says how). Without one, characters are kept in a file on the
# service's disk, which the free plan loses on every deploy and restart.
services:
  - type: web
    name: greenhollow-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TICK_MS
        value: "50"
      - key: GRACE_MS
        value: "30000"
      - key: SAVE_MS
        value: "30000"
      - key: DATABASE_URL
        sync: false
